apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "featureflags.fullname" . }}-server
  labels:
    {{- include "featureflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "featureflags.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "featureflags.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.migrations.mode "auto" }}
      initContainers:
        # In `auto` mode the server migrates as it starts, and its migration puts a trigger on
        # auth."user". So it has to wait for the auth service to be ready — ready meaning that
        # table exists, which is exactly what that readiness probe checks.
        - name: wait-for-auth
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/featureflags-auth:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              until wget --spider -q {{ include "featureflags.authAddress" . }}/health; do
                echo "waiting for the auth service to finish migrating"
                sleep 3
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- end }}
      containers:
        - name: server
          image: {{ include "featureflags.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Also tells the server it is behind a proxy, so it reads X-Forwarded-Proto rather
            # than believing every request arrived over plain HTTP.
            - name: FEATUREFLAGS_ORIGIN
              value: {{ include "featureflags.origin" . | quote }}
            - name: FEATUREFLAGS_AUTH_URL
              value: {{ include "featureflags.authAddress" . | quote }}
            - name: FEATUREFLAGS_REDIS_URL
              value: {{ include "featureflags.redisUrl" . | quote }}
            - name: FEATUREFLAGS_APPLY_MIGRATIONS
              value: {{ eq .Values.migrations.mode "auto" | quote }}
            {{- include "featureflags.databaseUrlEnv" . | nindent 12 }}
          # Readiness covers the database and the cache, because Aspire's client integrations
          # register their health checks into it. Liveness is only the "self" check, so a pod is
          # not restarted for a dependency being briefly unreachable.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "featureflags.fullname" . }}-server
  labels:
    {{- include "featureflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    {{- include "featureflags.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
