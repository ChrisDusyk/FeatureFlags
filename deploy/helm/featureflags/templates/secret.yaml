{{- /*
Created whenever the chart still has to supply something, rather than only when the auth secret
is chart-managed. Those are separate questions: an operator can bring their own Secret for
BETTER_AUTH_SECRET and still want the bundled database, whose password and URL nothing else
writes. Skipping this template in that case left every pod referencing keys that did not exist.
*/ -}}
{{- if include "featureflags.needsChartSecret" . }}
{{- $needsAuth := not .Values.betterAuth.existingSecret }}
{{- $needsDatabase := or .Values.postgres.bundled (not .Values.postgres.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "featureflags.chartSecretName" . }}
  labels:
    {{- include "featureflags.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsAuth }}
  {{- if not .Values.betterAuth.secret }}
  {{- fail "Set betterAuth.secret, or point betterAuth.existingSecret at a Secret holding BETTER_AUTH_SECRET. Generate one with: openssl rand -base64 32" }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ .Values.betterAuth.secret | quote }}
  {{- end }}

  {{- if .Values.postgres.bundled }}
  {{- $password := .Values.postgres.password }}
  {{- if not $password }}
  {{- fail "Set postgres.password when postgres.bundled is true, or use postgres.external.url instead. Generate a URL-safe one with: openssl rand -hex 24" }}
  {{- end }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- /*
    urlquery because this goes into a postgres:// URL: a '/' in the password would otherwise end
    the authority early, producing a connection with the wrong host and no credentials at all.
  */}}
  FEATUREFLAGS_DATABASE_URL: {{ printf "postgres://featureflags:%s@%s-postgres:5432/featureflagsdb" ($password | urlquery) (include "featureflags.fullname" .) | quote }}
  {{- else if $needsDatabase }}
  FEATUREFLAGS_DATABASE_URL: {{ required "Set postgres.external.url, or postgres.external.existingSecret, when postgres.bundled is false." .Values.postgres.external.url | quote }}
  {{- end }}
{{- end }}
